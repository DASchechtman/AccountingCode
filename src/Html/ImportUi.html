<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8" />
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
        font-weight: bold;
      }
      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .hide {
        visibility: hidden;
      }

      .loading-bar {
        border: 8px solid #f3f3f3; /* Light grey */
        border-top: 8px solid #3498db; /* Blue */
        border-radius: 50%;
        width: 80px; /* Adjust width */
        height: 80px; /* Adjust height */
        animation: spin 1s linear infinite;
        position: absolute;
        transform: translate(-50%, -50%);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .AddRow {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="import">
      <h2>Upload an HTML File</h2>
      <div class="AddRow">
        <button onclick="AddRow()">Add Row</button>
        <input type="date" placeholder="date" id="row-date" />
        <input type="text" placeholder="name" id="row-name" />
        <input
          type="number"
          step="0.01"
          min="0"
          placeholder="$0.00"
          id="row-amt"
        />
      </div>
      <input type="file" id="fileInput" accept=".html" />
      <button onclick="readFile()">Upload</button>

      <h3>File Transactions:</h3>
      <div id="preview">
        <table id="transactions">
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button onclick="Process()">Import Transactions</button>
    </div>

    <div id="load-wheel" class="hide">
      <div class="loading-bar"></div>
    </div>

    <div id="success" class="hide">
      <h2>Transactions successfully imported!</h2>
    </div>
    <div id="fail" class="hide">
      <h2>Transactions could not be loaded!</h2>
    </div>

    <script>
      let values_to_process = function() {
        const table = document.getElementById('transactions').getElementsByTagName('tbody')[0].getElementsByTagName('tr')
        let vals = []

        for (let i = 0; i < table.length; i++) {
          let row = table[i]
          let cells = Array.from(row.getElementsByTagName('td')).map(x => x.innerText)
          vals.push(cells)
        }

        return vals
      };
      function ParseHtml(html, start_key) {
        let start = html.indexOf(start_key);
        if (start < 0) {
          return "";
        }

        let end = html.indexOf("</table>", start);
        if (end < 0) {
          return "";
        }

        console.log(start, end);

        let search_start = start;
        let vals = [];

        while (true) {
          const SEARCH_KEY = "data-values";
          search_start = html.indexOf(SEARCH_KEY, search_start);
          if (search_start < 0 || search_start > end) {
            break;
          }

          let search_start_copy = search_start;
          let str_list = [];
          let found_quotes = false;
          while (true) {
            if (html[search_start_copy] == '"') {
              if (!found_quotes) {
                found_quotes = true;
              } else {
                console.log(str_list.join(""));
                break;
              }
            } else if (found_quotes) {
              str_list.push(html[search_start_copy]);
            }
            search_start_copy++;
          }

          vals.push(
            str_list
              .join("")
              .split(",")
              .filter((x) => x != "")
          );
          search_start += SEARCH_KEY.length;
        }

        return vals;
      }
      /**
       * @param {string} html
       * */
      function ParseTransactions(html) {
        let vals = [
          ...ParseHtml(
            html,
            '<table id="PENDING-dataTableId-mds-diy-data-table"'
          ),
          ...ParseHtml(
            html,
            '<table id="ACTIVITY-dataTableId-mds-diy-data-table"'
          ),
        ];

        for (let row of vals) {
          AddRow(row[0], row[1], row[2])
        }
        
      }

      function readFile() {
        var input = document.getElementById("fileInput");
        if (input.files.length === 0) {
          alert("Please select a file.");
          return;
        }

        var file = input.files[0];
        var reader = new FileReader();

        reader.onload = function (event) {
          ParseTransactions(event.target.result);
        };

        reader.readAsText(file);
      }

      function AddRow(date, name, amount) {
        const table = document.getElementById('transactions').getElementsByTagName('tbody')[0]
        
        const newRow = table.insertRow()
        const dateCell = newRow.insertCell(0)
        const nameCell = newRow.insertCell(1)
        const amtCell = newRow.insertCell(2)
        
        let new_date = date
        let new_name = name
        let new_amt = amount

        if (new_date == null) {
          const field = document.getElementById("row-date")
          new_date = field.value
          field.value = ""

          if (new_date === "") {
            const new_date_obj = new Date()
            const day = String(new_date_obj.getDate()).padStart(2, '0')
            const month = String(new_date_obj.getMonth()+1).padStart(2, '0')
            const year = new_date_obj.getFullYear()

            new_date = `${month}/${day}/${year}`
          }
          else {
            const date_comps = new_date.split('-')
            const day = date_comps[2]
            const month = date_comps[1]
            const year = date_comps[0]
            new_date = `${month}/${day}/${year}`
          }
        }

        if (new_name == null) {
          const field = document.getElementById("row-name")
          new_name = field.value
          field.value = ""
        }

        if (new_amt == null) {
          const field = document.getElementById("row-amt")
          new_amt = new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD'
          }).format(field.value)
          field.value = 0
        }

        if (new_name === "" || Number(new_amt) === 0) { return }

        dateCell.innerText = new_date
        nameCell.innerText = new_name
        amtCell.innerText = new_amt
      }

      function Process() {
        let val_to_process = values_to_process()
          .map((row) => {
            return {
              date: row[0],
              name: row[1].replace("&#39;", "'"),
              amt: Number(row[2].slice(1)),
            };
          })
          .sort((a, b) => new Date(a.date) - new Date(b.date))
          .filter((a) => a.amt > 0);

        document.getElementById("import").remove();
        document.getElementById("load-wheel").className = "";

        google.script.run
          .withSuccessHandler(Success)
          .withFailureHandler(Fail)
          .__ICH_AddToSheet(val_to_process);
      }

      function Success() {
        document.getElementById("load-wheel").remove();
        document.getElementById("success").className = "";
      }

      function Fail() {
        document.getElementById("load-wheel").remove();
        document.getElementById("fail").className = "";
      }
    </script>
  </body>
</html>
